name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public API base URL (no trailing slash)"
        required: false
        default: "https://canix402-api.compx.io"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Public API smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X402_PRODUCTION_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://canix402-api.compx.io' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke checks
        run: npm run test:production-smoke -w protocol
